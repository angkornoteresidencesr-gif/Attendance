<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Staff Check-In</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111827);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --card: var(--tg-theme-secondary-bg-color, #f3f4f6);
    --btn: var(--tg-theme-button-color, #2563eb);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --ok: #16a34a;
    --late: #dc2626;
    --warn: #d97706;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .card { width: 100%; max-width: 420px; background: var(--card); border-radius: 20px;
    padding: 28px 22px; text-align: center; }
  .icon { font-size: 56px; line-height: 1; margin-bottom: 12px; }
  .icon.spin { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .6; } }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.sub { margin: 0 0 18px; color: var(--hint); font-size: 15px; line-height: 1.45; }
  .rows { margin: 0 0 18px; text-align: left; border-radius: 12px; background: var(--bg); overflow: hidden; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; font-size: 15px;
    border-bottom: 1px solid rgba(127,127,127,.18); }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--hint); }
  .row .v { font-weight: 600; text-align: right; word-break: break-word; user-select: text; }
  .tone-ok h1 { color: var(--ok); }
  .tone-late h1 { color: var(--late); }
  .tone-error h1 { color: var(--late); }
  .tone-warn h1 { color: var(--warn); }
  button { width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 600;
    background: var(--btn); color: var(--btn-text); cursor: pointer; }
  button:active { opacity: .85; }
  button:disabled { opacity: .5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <div class="icon" id="icon">📍</div>
    <h1 id="title">Staff Check-In</h1>
    <p class="sub" id="text">Loading…</p>
    <div class="rows" id="rows" hidden></div>
    <button id="btn" hidden>📍 Check In Now</button>
  </div>
</main>

<script>
/* ===================== SETTINGS (edit this one line) ===================== */
const API_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTWLOYs4oFLK1vA96f11HeitEFLgxhRYcF7a2LVxBXj6rVug5PSuVzZIGdwVait62phbsEQneYpAyq7-rA8BblhyEKse1JawwVcaOgu5Xxi0W3JsFdxKqfG995OqlI0HwmGG-C5mI7r6acEleqMGaB7mOlSG1id39k4ZhB6gQZjHzeWtjQr78vFsX_irVNBRQwP3MAEdgL0nS-BvfX1w9-bD_V8de2Wc9JPVnXMLdTEEB_fMbTNQwnXP16XBXnGw9boBPDkAx4RvMSWaV9wDGfh10IocA&lib=MgMOAut08ivJ-KtyPKiHh0HHTDI_PZE3m';   // the URL ending in /exec
const GOOD_ACCURACY_M = 25;   // stop waiting for a better GPS fix once accuracy is this good
const GPS_WAIT_MS = 15000;    // max time to wait for a good GPS fix (browser fallback)
/* ======================================================================== */

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const $ = function (id) { return document.getElementById(id); };
let busy = false;

/** Draws the screen. rows = [[label, value], ...] */
function render(o) {
  $('icon').textContent = o.icon || '📍';
  $('icon').className = 'icon' + (o.spin ? ' spin' : '');
  $('title').textContent = o.title || '';
  $('text').textContent = o.text || '';
  $('card').className = 'card' + (o.tone ? ' tone-' + o.tone : '');

  const rowsEl = $('rows');
  rowsEl.innerHTML = '';
  if (o.rows && o.rows.length) {
    o.rows.forEach(function (r) {
      const row = document.createElement('div');
      row.className = 'row';
      const k = document.createElement('span'); k.className = 'k'; k.textContent = r[0];
      const v = document.createElement('span'); v.className = 'v'; v.textContent = r[1];
      row.appendChild(k); row.appendChild(v);
      rowsEl.appendChild(row);
    });
    rowsEl.hidden = false;
  } else {
    rowsEl.hidden = true;
  }

  const btn = $('btn');
  btn.hidden = !o.button;
  btn.textContent = o.button || '';
  btn.disabled = false;
}

function haptic(type) {
  try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type); } catch (e) {}
}

/* -------- GPS option 1: Telegram's built-in location (newer Telegram apps) -------- */
function getTelegramLocation() {
  return new Promise(function (resolve) {
    const lm = tg && tg.LocationManager;
    if (!lm || !tg.isVersionAtLeast || !tg.isVersionAtLeast('8.0')) return resolve(null);

    let done = false;
    function finish(v) { if (!done) { done = true; resolve(v); } }
    setTimeout(function () { finish(null); }, 25000);

    function request() {
      if (!lm.isLocationAvailable) return finish(null);
      lm.getLocation(function (loc) {
        if (!loc) return finish(null); // denied or unavailable -> fall back to the browser
        finish({ lat: loc.latitude, lng: loc.longitude, accuracy: loc.horizontal_accuracy || null });
      });
    }
    if (lm.isInited) request(); else lm.init(request);
  });
}

/* -------- GPS option 2: browser geolocation (collects readings, keeps the best) -------- */
function getBrowserLocation() {
  return new Promise(function (resolve, reject) {
    if (!navigator.geolocation) return reject({ code: 0 });
    let best = null, settled = false, watchId, timer;

    function finish() {
      if (settled) return;
      settled = true;
      navigator.geolocation.clearWatch(watchId);
      clearTimeout(timer);
      if (best) resolve(best); else reject({ code: 3 });
    }

    timer = setTimeout(finish, GPS_WAIT_MS);
    watchId = navigator.geolocation.watchPosition(
      function (pos) {
        const c = pos.coords;
        const fix = { lat: c.latitude, lng: c.longitude, accuracy: c.accuracy };
        if (!best || fix.accuracy < best.accuracy) best = fix;
        if (fix.accuracy <= GOOD_ACCURACY_M) finish();
      },
      function (err) {
        if (best) return finish();
        settled = true;
        navigator.geolocation.clearWatch(watchId);
        clearTimeout(timer);
        reject(err);
      },
      { enableHighAccuracy: true, timeout: GPS_WAIT_MS, maximumAge: 0 }
    );
  });
}

async function getPosition() {
  const viaTelegram = await getTelegramLocation();
  if (viaTelegram) return viaTelegram;
  return getBrowserLocation();
}

/* -------- Send to Google Apps Script -------- */
async function submitCheckIn(pos) {
  // No custom headers on purpose: this keeps it a "simple" request so the browser does not block it (CORS).
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'checkin',
      initData: tg.initData,
      lat: pos.lat,
      lng: pos.lng,
      accuracy: pos.accuracy
    })
  });
  return res.json();
}

/* -------- Screens -------- */
function showLocationError(err) {
  haptic('error');
  if (err && err.code === 1) {
    render({
      icon: '🔒', tone: 'warn', title: 'Location permission needed',
      text: 'Please allow location for Telegram: open your phone Settings > Telegram > Location, choose "While Using" and turn on Precise Location. Then reopen this page.',
      button: 'Try Again'
    });
  } else {
    render({
      icon: '📡', tone: 'warn', title: 'Could not get your location',
      text: 'Make sure GPS / Location is switched on, then try again. Standing near a window or outside the door helps.',
      button: 'Try Again'
    });
  }
}

function showResult(res) {
  if (res.ok) {
    haptic(res.late ? 'warning' : 'success');
    render({
      icon: res.late ? '⏰' : '✅',
      tone: res.late ? 'late' : 'ok',
      title: 'Checked in!',
      text: res.late
        ? 'You are ' + res.minutesLate + ' min late (shift starts ' + res.shift + ').'
        : 'You are on time. Have a great workday!',
      rows: [
        ['Name', res.name], ['Position', res.position || '-'],
        ['Date', res.date], ['Check-in time', res.time],
        ['Status', res.status], ['Distance', res.distance + ' m']
      ]
    });
    return;
  }

  haptic('error');
  switch (res.code) {
    case 'ALREADY_CHECKED_IN':
      render({ icon: 'ℹ️', title: 'Already checked in', text: 'Your check-in for today is already recorded.',
        rows: [['Name', res.name], ['Date', res.date], ['Time', res.time], ['Status', res.status]] });
      break;
    case 'OUT_OF_BOUNDS':
      render({ icon: '❌', tone: 'error', title: 'Check-in blocked',
        text: 'You are ' + res.distance + ' meters away from the office. You must be within ' + res.radius +
              ' meters. Please check in when you arrive on site.',
        button: 'Try Again' });
      break;
    case 'LOW_ACCURACY':
      render({ icon: '📡', tone: 'warn', title: 'GPS signal too weak',
        text: 'Your location accuracy is about ' + res.accuracy + ' m. Turn on Precise Location, move near a window or outside, then try again.',
        button: 'Try Again' });
      break;
    case 'NOT_REGISTERED':
      render({ icon: '🔒', tone: 'warn', title: 'Not registered yet',
        text: 'Please send this Telegram ID to your manager so they can add you:',
        rows: [['Your Telegram ID', String(res.userId)]] });
      break;
    case 'INACTIVE':
      render({ icon: '🚫', tone: 'error', title: 'Account inactive', text: res.message });
      break;
    case 'AUTH_FAILED':
    case 'SESSION_EXPIRED':
      render({ icon: '🔄', tone: 'warn', title: 'Please reopen', text: res.message });
      break;
    default:
      render({ icon: '⚠️', tone: 'error', title: 'Something went wrong',
        text: res.message || 'Please try again.', button: 'Try Again' });
  }
}

async function onCheckIn() {
  if (busy) return;
  busy = true;

  render({ icon: '🛰️', spin: true, title: 'Getting your location…',
    text: 'Keep Telegram open. This takes a few seconds.' });

  let pos;
  try {
    pos = await getPosition();
  } catch (err) {
    busy = false;
    return showLocationError(err);
  }

  render({ icon: '⏳', spin: true, title: 'Verifying…', text: 'Checking your location and shift time.' });

  try {
    showResult(await submitCheckIn(pos));
  } catch (err) {
    haptic('error');
    render({ icon: '📶', tone: 'warn', title: 'Connection problem',
      text: 'Could not reach the server. Check your internet and try again.', button: 'Try Again' });
  }
  busy = false;
}

/* -------- Start -------- */
$('btn').addEventListener('click', onCheckIn);

(function init() {
  if (!tg || !tg.initData) {
    render({ icon: '📵', tone: 'warn', title: 'Open from Telegram',
      text: 'This page only works inside Telegram. Scan the office QR code with your phone camera.' });
    return;
  }
  if (API_URL.indexOf('PASTE_') === 0) {
    render({ icon: '🛠️', tone: 'error', title: 'Not configured',
      text: 'The API_URL at the top of index.html has not been set yet.' });
    return;
  }
  const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
  render({
    icon: '📍',
    title: 'Hello' + (u && u.first_name ? ', ' + u.first_name : '') + '!',
    text: 'Tap the button below to verify your location and check in.',
    button: '📍 Check In Now'
  });
})();
</script>
</body>
</html>

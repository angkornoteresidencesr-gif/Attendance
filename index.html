<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Staff Attendance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111827);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --card: var(--tg-theme-secondary-bg-color, #f3f4f6);
    --btn: var(--tg-theme-button-color, #2563eb);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --ok: #16a34a;
    --late: #dc2626;
    --warn: #d97706;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .card { width: 100%; max-width: 420px; background: var(--card); border-radius: 20px;
    padding: 28px 22px; text-align: center; }
  .icon { font-size: 56px; line-height: 1; margin-bottom: 12px; }
  .icon.spin { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .6; } }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.sub { margin: 0 0 18px; color: var(--hint); font-size: 15px; line-height: 1.45; white-space: pre-line; }
  .rows { margin: 0 0 18px; text-align: left; border-radius: 12px; background: var(--bg); overflow: hidden; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; font-size: 14px;
    border-bottom: 1px solid rgba(127,127,127,.18); }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--hint); }
  .row .v { font-weight: 600; text-align: right; word-break: break-word; user-select: text; }
  .tone-ok h1 { color: var(--ok); }
  .tone-late h1, .tone-error h1 { color: var(--late); }
  .tone-warn h1 { color: var(--warn); }
  button { width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 600;
    background: var(--btn); color: var(--btn-text); cursor: pointer; }
  button:active { opacity: .85; }
  button:disabled { opacity: .5; }
  pre.debug { margin: 0 0 16px; padding: 10px 12px; text-align: left; font-size: 12px; line-height: 1.4;
    white-space: pre-wrap; word-break: break-word; background: var(--bg); color: var(--hint);
    border-radius: 10px; user-select: text; }
  .status { width: 100%; max-width: 420px; margin-top: 14px; font-size: 12px; line-height: 1.4; text-align: center;
    color: var(--hint); word-break: break-word; }
  .status.good { color: var(--ok); }
  .status.bad { color: var(--late); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <div class="icon" id="icon">📍</div>
    <h1 id="title">Staff Attendance</h1>
    <p class="sub" id="text">Loading…</p>
    <div class="rows" id="rows" hidden></div>
    <pre class="debug" id="debug" hidden></pre>
    <button id="btn" hidden></button>
  </div>
  <div class="status" id="status" hidden></div>
</main>

<script>
/* ======================== SETTINGS (edit these) ======================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzCAaqQ1NR-kSHnt8Vs0_EkkU-63EWb_6sVANYYuHuQOgcxptDpojx2JixrbxUi6Ta2bQ/exec';  // full URL ending in /exec
const DEBUG = true;            // true = show technical details on errors. Set to false when everything works.
const PAGE_VERSION = 'v4';     // shown in the footer so you can confirm the new page loaded
const API_TIMEOUT_MS = 30000;  // how long to wait for the server (the first call can be slow)
const GOOD_ACCURACY_M = 25;    // stop waiting for a better GPS fix once accuracy is this good
const GPS_WAIT_MS = 15000;     // max time to wait for a good GPS fix (browser fallback)
/* ======================================================================== */

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const $ = function (id) { return document.getElementById(id); };
let busy = false;
let state = null;     // latest state from the server (who I am, today's logs, next button)
let handler = null;   // what the big button does right now

/** Draws the screen. rows = [[label, value], ...]. onClick = what the button does. */
function render(o) {
  $('icon').textContent = o.icon || '📍';
  $('icon').className = 'icon' + (o.spin ? ' spin' : '');
  $('title').textContent = o.title || '';
  $('text').textContent = o.text || '';
  $('card').className = 'card' + (o.tone ? ' tone-' + o.tone : '');

  const rowsEl = $('rows');
  rowsEl.innerHTML = '';
  if (o.rows && o.rows.length) {
    o.rows.forEach(function (r) {
      const row = document.createElement('div');
      row.className = 'row';
      const k = document.createElement('span'); k.className = 'k'; k.textContent = r[0];
      const v = document.createElement('span'); v.className = 'v'; v.textContent = r[1];
      row.appendChild(k); row.appendChild(v);
      rowsEl.appendChild(row);
    });
    rowsEl.hidden = false;
  } else {
    rowsEl.hidden = true;
  }

  const dbg = $('debug');
  if (o.debug && DEBUG) { dbg.textContent = o.debug; dbg.hidden = false; } else { dbg.hidden = true; }

  const btn = $('btn');
  btn.hidden = !o.button;
  btn.textContent = o.button || '';
  btn.disabled = false;
  handler = o.onClick || null;
}

$('btn').addEventListener('click', function () { if (handler) handler(); });

function setStatus(ok, text) {
  if (!DEBUG) return;
  const el = $('status');
  el.hidden = false;
  el.className = 'status ' + (ok ? 'good' : 'bad');
  el.textContent = text;
}

function shortUrl() {
  const u = API_URL.replace(/^https?:\/\//, '');
  return u.length > 46 ? u.slice(0, 28) + '…' + u.slice(-14) : u;
}

function haptic(type) {
  try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type); } catch (e) {}
}

function closeApp() { if (tg && tg.close) tg.close(); }

function logRows(logs) {
  return (logs || []).map(function (l) { return [l.type, l.time + ' · ' + l.status]; });
}

/* ------------------------- Talking to Apps Script ------------------------- */
function apiError(kind, message) {
  const e = new Error(message);
  e.kind = kind;
  return e;
}

async function callApi(payload) {
  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, API_TIMEOUT_MS);
  let raw;
  try {
    // No custom headers on purpose: keeps it a "simple" request so the browser does not block it (CORS).
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), signal: ctrl.signal });
    raw = await res.text();
  } catch (e) {
    if (e && e.name === 'AbortError') throw apiError('TIMEOUT', 'No answer from the server after ' + (API_TIMEOUT_MS / 1000) + ' seconds.');
    throw apiError('NETWORK', 'Request blocked or server unreachable (' + (e && e.message ? e.message : e) + ').');
  } finally {
    clearTimeout(timer);
  }
  let data;
  try { data = JSON.parse(raw); }
  catch (e) { throw apiError('BAD_REPLY', 'Server did not return data. It replied: ' + raw.replace(/\s+/g, ' ').slice(0, 160)); }
  if (!data || typeof data !== 'object') throw apiError('BAD_REPLY', 'Unexpected reply from server.');
  return data;
}

function showApiError(err, retry) {
  haptic('error');
  let text;
  if (err.kind === 'TIMEOUT') {
    text = 'The server took too long to answer. Check your internet and try again.';
  } else if (err.kind === 'BAD_REPLY') {
    text = 'The server sent an unexpected reply. The manager needs to redeploy the Apps Script (a new version).';
  } else {
    text = 'Could not reach the server. Check your internet and try again. If it keeps failing, tell your manager.';
  }
  setStatus(false, 'Page ' + PAGE_VERSION + ' · Server NOT reachable ❌ — ' + err.message);
  render({
    icon: '📶', tone: 'warn', title: 'Connection problem', text: text, button: 'Try Again', onClick: retry,
    debug: (err.message || String(err)) + '\nAPI: ' + shortUrl() + '\nPage ' + PAGE_VERSION
  });
}

/* ---------------- GPS option 1: Telegram's built-in location ---------------- */
function getTelegramLocation() {
  return new Promise(function (resolve) {
    const lm = tg && tg.LocationManager;
    if (!lm || !tg.isVersionAtLeast || !tg.isVersionAtLeast('8.0')) return resolve(null);

    let done = false;
    function finish(v) { if (!done) { done = true; resolve(v); } }
    setTimeout(function () { finish(null); }, 25000);

    function request() {
      if (!lm.isLocationAvailable) return finish(null);
      lm.getLocation(function (loc) {
        if (!loc) return finish(null); // denied or unavailable -> fall back to the browser
        finish({ lat: loc.latitude, lng: loc.longitude, accuracy: loc.horizontal_accuracy || null });
      });
    }
    if (lm.isInited) request(); else lm.init(request);
  });
}

/* ------------- GPS option 2: browser geolocation (keeps best fix) ------------- */
function getBrowserLocation() {
  return new Promise(function (resolve, reject) {
    if (!navigator.geolocation) return reject({ code: 0 });
    let best = null, settled = false, watchId, timer;

    function finish() {
      if (settled) return;
      settled = true;
      navigator.geolocation.clearWatch(watchId);
      clearTimeout(timer);
      if (best) resolve(best); else reject({ code: 3 });
    }

    timer = setTimeout(finish, GPS_WAIT_MS);
    watchId = navigator.geolocation.watchPosition(
      function (pos) {
        const c = pos.coords;
        const fix = { lat: c.latitude, lng: c.longitude, accuracy: c.accuracy };
        if (!best || fix.accuracy < best.accuracy) best = fix;
        if (fix.accuracy <= GOOD_ACCURACY_M) finish();
      },
      function (err) {
        if (best) return finish();
        settled = true;
        navigator.geolocation.clearWatch(watchId);
        clearTimeout(timer);
        reject(err);
      },
      { enableHighAccuracy: true, timeout: GPS_WAIT_MS, maximumAge: 0 }
    );
  });
}

async function getPosition() {
  const viaTelegram = await getTelegramLocation();
  if (viaTelegram) return viaTelegram;
  return getBrowserLocation();
}

/* ------------------------------- Screens ------------------------------- */

/** Home screen: today's timeline + the ONE button that fits the current state. */
function renderState(st, notice) {
  state = st;
  const sub = [st.position, 'Shift ' + st.shiftStart + ' – ' + st.shiftEnd].filter(Boolean).join(' · ');
  const rows = logRows(st.logs);

  if (st.done) {
    render({ icon: '🎉', tone: 'ok', title: 'All done for today', text: sub + '\nYou have completed all 4 records. See you tomorrow!',
             rows: rows, button: 'Close', onClick: closeApp });
    return;
  }
  render({
    icon: '📍',
    title: 'Hello, ' + st.name + '!',
    text: (notice ? notice + '\n' : '') + sub + (rows.length ? '' : '\nNo records yet today.'),
    rows: rows,
    button: st.next.label,
    onClick: onAction
  });
}

function showLocationError(err) {
  haptic('error');
  if (err && err.code === 1) {
    render({
      icon: '🔒', tone: 'warn', title: 'Location permission needed',
      text: 'Please allow location for Telegram: open your phone Settings > Telegram > Location, choose "While Using" and turn on Precise Location. Then reopen this page.',
      button: 'Try Again', onClick: onAction
    });
  } else {
    render({
      icon: '📡', tone: 'warn', title: 'Could not get your location',
      text: 'Make sure GPS / Location is switched on, then try again. Standing near a window or outside the door helps.',
      button: 'Try Again', onClick: onAction
    });
  }
}

/** Handles every reply of action "log" (success or error). */
function showLogResult(res) {
  if (res.ok) {
    const e = res.entry;
    state = res.state;
    haptic(e.tone === 'late' ? 'warning' : 'success');
    render({
      icon: e.tone === 'late' ? '⏰' : (e.tone === 'warn' ? '🟠' : '✅'),
      tone: e.tone,
      title: 'Recorded!',
      text: e.card + ' at ' + e.time + '\nStatus: ' + e.status + (e.note ? ' (' + e.note + ')' : ''),
      rows: logRows(res.state.logs).concat([['Distance', e.distance + ' m']]),
      button: 'Close', onClick: closeApp
    });
    return;
  }

  haptic('error');
  switch (res.code) {
    case 'OUT_OF_BOUNDS':
      render({ icon: '❌', tone: 'error', title: 'Check blocked',
        text: res.message,
        rows: [['Your distance', res.distance + ' m'], ['Allowed', res.radius + ' m']],
        button: 'Try Again', onClick: onAction });
      break;
    case 'LOW_ACCURACY':
      render({ icon: '📡', tone: 'warn', title: 'GPS signal too weak',
        text: 'Your location accuracy is about ' + res.accuracy + ' m. Turn on Precise Location, move near a window or outside, then try again.',
        button: 'Try Again', onClick: onAction });
      break;
    case 'TOO_SOON':
      render({ icon: '⏱️', tone: 'warn', title: 'Please wait a moment', text: res.message,
        button: 'Try Again', onClick: onAction });
      break;
    case 'STATE_CHANGED':
    case 'ALREADY_COMPLETE':
      renderState(res.state, res.message);
      break;
    case 'NOT_REGISTERED':
      showNotRegistered(res);
      break;
    case 'AUTH_FAILED':
    case 'SESSION_EXPIRED':
      render({ icon: '🔄', tone: 'warn', title: 'Please reopen', text: res.message, debug: res.code });
      break;
    default:
      render({ icon: '⚠️', tone: 'error', title: 'Something went wrong',
        text: res.message || 'Please try again.', button: 'Try Again', onClick: onAction, debug: res.code || '' });
  }
}

function showNotRegistered(res) {
  render({ icon: '🔒', tone: 'warn', title: 'Not registered yet',
    text: 'Please send this Telegram ID to your manager so they can add you:',
    rows: [['Your Telegram ID', String(res.userId)]] });
}

/* ------------------------------ Actions ------------------------------ */

/** Loads who I am + today's records from the server, then shows the right button. */
async function loadState() {
  render({ icon: '⏳', spin: true, title: 'Loading…', text: 'Getting your attendance for today.' });
  try {
    const res = await callApi({ action: 'state', initData: tg.initData });
    setStatus(true, 'Page ' + PAGE_VERSION + ' · Server connected ✅');
    if (res.ok) return renderState(res.state);
    if (res.code === 'NOT_REGISTERED') return showNotRegistered(res);
    haptic('error');
    render({ icon: '🔄', tone: 'warn', title: 'Please reopen', text: res.message || 'Please try again.',
             button: 'Try Again', onClick: loadState, debug: res.code || '' });
  } catch (err) {
    showApiError(err, loadState);
  }
}

/** The big button: get GPS, send it with the session I expect, show the result. */
async function onAction() {
  if (busy || !state || !state.next) return;
  busy = true;
  const expected = state.next.type;

  render({ icon: '🛰️', spin: true, title: 'Getting your location…',
    text: 'Keep Telegram open. This takes a few seconds.' });

  let pos;
  try {
    pos = await getPosition();
  } catch (err) {
    busy = false;
    return showLocationError(err);
  }

  render({ icon: '⏳', spin: true, title: 'Verifying…', text: 'Checking your location and shift time.' });

  try {
    const res = await callApi({
      action: 'log',
      initData: tg.initData,
      expected: expected,
      lat: pos.lat,
      lng: pos.lng,
      accuracy: pos.accuracy
    });
    busy = false;
    showLogResult(res);
  } catch (err) {
    busy = false;
    showApiError(err, onAction);
  }
}

/* --------------------------------- Start --------------------------------- */
(function init() {
  if (!tg || !tg.initData) {
    render({ icon: '📵', tone: 'warn', title: 'Open from Telegram',
      text: 'This page only works inside Telegram. Scan the office QR code with your phone camera.' });
    return;
  }
  if (API_URL.indexOf('https://script.google.com/') !== 0) {
    render({ icon: '🛠️', tone: 'error', title: 'Not configured',
      text: 'API_URL at the top of index.html must be your Apps Script Web App URL (starting with https://script.google.com/ and ending in /exec).' });
    return;
  }
  loadState();
})();
</script>
</body>
</html>
